; The 2 MB photo limit is a business rule checked by the use case (AC-03.4).
; PHP is left deliberately looser: if PHP cut the request short, the client
; would get a server error instead of the 422 the contract promises.
upload_max_filesize = 8M
post_max_size = 8M
memory_limit = 256M
date.timezone = UTC

; Warnings and notices go to the log, never into the response.
;
; A warning printed before the body put HTML in front of a JSON answer, which
; breaks every client parsing it, and the message carries the server's paths.
; One error body is the contract (api-contract 1), and a warning is not it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
