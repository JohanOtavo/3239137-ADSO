server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # One page, and the routes live in the hash, so every path resolves to the
    # same document. A missing asset still answers 404.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
