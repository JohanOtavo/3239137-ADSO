name: filmgear api

on:
  push:
    paths:
      - '03-execute/30-week/plan-mejoramiento/api/**'
      - '.github/workflows/filmgear-api.yml'
  pull_request:
    paths:
      - '03-execute/30-week/plan-mejoramiento/api/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-execute/30-week/plan-mejoramiento/api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The suites that need nothing: plain objects and the source files
      # themselves. Integration stays out because it needs a live PostgreSQL.
      - name: Domain, application, adapters and architecture
        run: vendor/bin/phpunit --testsuite=domain,application,adapters,architecture
