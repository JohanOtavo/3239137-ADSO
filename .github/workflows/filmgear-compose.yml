name: filmgear compose

# Scoped with paths so this workflow only runs for the improvement plan folder
# and never fires for the rest of the course repository.
on:
  push:
    paths:
      - '03-execute/30-week/plan-mejoramiento/infra/**'
      - '03-execute/30-week/plan-mejoramiento/api/**'
      - '.github/workflows/filmgear-compose.yml'
  pull_request:
    paths:
      - '03-execute/30-week/plan-mejoramiento/infra/**'
      - '03-execute/30-week/plan-mejoramiento/api/**'

jobs:
  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-execute/30-week/plan-mejoramiento/infra

    steps:
      - uses: actions/checkout@v4

      - name: Provide the environment the compose file expects
        run: cp .env.example .env

      - name: Validate the compose file
        run: docker compose config --quiet

      # Article V: infra starts an empty engine. The schema belongs to the
      # migrations.
      #
      # The check looks for the two ways DDL could actually reach this folder,
      # not for the words themselves. A plain text search matches the README
      # and the compose comment that document this very rule, which is how the
      # first version of this job failed on its own documentation.
      - name: Assert no DDL ships with infra
        run: |
          if find . -name '*.sql' -print -quit | grep -q . ; then
            echo "infra must not ship .sql files: the schema belongs to the migrations (article V, ADR-001)"
            find . -name '*.sql'
            exit 1
          fi

          if grep -rl "docker-entrypoint-initdb.d" . ; then
            echo "infra must not mount an init directory into the engine (article V, ADR-001)"
            exit 1
          fi

          echo "no .sql files and no init mount: the engine starts empty"
